# Search Flights under https://appsstore.io/searchflights/ -- gunicorn app from /var/www/fli-flights (searchflights.service)
location = /searchflights { return 301 /searchflights/; }   # relative api/ paths need the trailing slash

location /searchflights/ {
    proxy_pass http://127.0.0.1:5001/;             # strips /searchflights so app.py keeps its / and /api routes
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # round-trip searches make several Google requests; matches gunicorn --timeout 120
    proxy_read_timeout 120s;
    # the airport list is ~770 KB of JSON; compress it (and search results)
    gzip on;
    gzip_proxied any;
    gzip_types application/json;
}
