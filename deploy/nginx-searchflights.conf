# Paste inside the existing `server { ... }` block for appsstore.io.

location = /searchflights {
    return 301 /searchflights/;
}

location /searchflights/ {
    proxy_pass http://127.0.0.1:5001/;   # trailing slash strips the /searchflights prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;             # round-trip searches can take a while
}
